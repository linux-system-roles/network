---
name: Ansible Test
on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      requested:
        description: Run this workflow for an authorized /citest command
        required: true
        type: boolean
env:
  LSR_ROLE2COLL_NAMESPACE: fedora
  LSR_ROLE2COLL_NAME: linux_system_roles
permissions:
  contents: read
  pull-requests: read
  # This is required for the ability to create/update the Pull request status
  statuses: write
jobs:
  ansible_test:
    if: inputs.requested || github.event_name != 'issue_comment'
    runs-on: ${{ matrix.versions.runner_os }}
    strategy:
      fail-fast: false  # get all results, not just the first failure
      matrix:
        versions:
          - { ansible: "2-14", python: "3.9", runner_os: "ubuntu-24.04" }
          - { ansible: "2-16", python: "3.11", runner_os: "ubuntu-latest" }
          - { ansible: "2-17", python: "3.12", runner_os: "ubuntu-latest" }
          - { ansible: "2-20", python: "3.13", runner_os: "ubuntu-latest" }
          - { ansible: "2-21", python: "3.13", runner_os: "ubuntu-latest" }
          - { ansible: "2-22", python: "3.14", runner_os: "ubuntu-26.04" }
          - { ansible: "milestone", python: "3.14", runner_os: "ubuntu-latest" }
    steps:
      - name: Get PR head SHA and context
        if: github.event_name == 'issue_comment'
        id: head_sha_context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          CONTEXT: "${{ github.workflow }} / ${{ github.job }} (${{ matrix.versions.ansible }}, ${{ matrix.versions.python }}) (pull_request)"
        run: |
          set -euxo pipefail
          head_sha=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.sha')
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "context=$CONTEXT" >> "$GITHUB_OUTPUT"

      - name: Set commit status as pending
        if: github.event_name == 'issue_comment'
        uses: linux-system-roles/.github/github-actions/commit-status@main
        with:
          sha: ${{ steps.head_sha_context.outputs.head_sha }}
          status: pending
          context: ${{ steps.head_sha_context.outputs.context }}
          description: Test started
          targetUrl: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/job/${{ job.check_run_id }}

      - name: Update pip, git
        run: |
          set -euxo pipefail
          python3 -m pip install --upgrade pip
          sudo apt update
          sudo apt install -y git

      - name: Checkout repo
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.head_sha_context.outputs.head_sha || github.sha }}

      - name: Install tox, tox-lsr
        run: |
          set -euxo pipefail
          pip3 install "git+https://github.com/linux-system-roles/tox-lsr@241b655430b2fa3c2406b6d2a1190c9febb34b5b"

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.versions.python }}

      - name: Convert role to collection format
        run: tox -e collection

      # https://bugs.launchpad.net/ubuntu/+source/podman/+bug/2154379
      # https://lists.ubuntu.com/archives/apparmor/2026-January/013962.html
      - name: Disable AppArmor and unprivileged_userns restriction and use podman for docker
        if: matrix.versions.ansible == '2-22'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt install -y podman-docker apparmor-utils
          # disable AppArmor
          sudo aa-teardown
          sudo aa-status && echo ERROR: failed to disable AppArmor || echo INFO: AppArmor disabled

      - name: Run ansible-test
        run: |
          tox \
            -x testenv:ansible-test-${{ matrix.versions.ansible }}.basepython="python${{ matrix.versions.python }}" \
            -e ansible-test-${{ matrix.versions.ansible }}

      - name: Set final commit status
        if: always() && github.event_name == 'issue_comment' && steps.head_sha_context.outputs.head_sha != ''
        uses: linux-system-roles/.github/github-actions/commit-status@main
        with:
          sha: ${{ steps.head_sha_context.outputs.head_sha }}
          status: ${{ job.status }}
          context: ${{ steps.head_sha_context.outputs.context }}
          description: Test finished
          targetUrl: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/job/${{ job.check_run_id }}
